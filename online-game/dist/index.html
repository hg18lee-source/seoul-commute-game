<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#142b30">
  <title>대중교통 출근 게임 — SEOUL COMMUTE</title>
  <meta name="description" content="서울의 아침, 체력 100으로 시작하는 출근길. 실제 노선으로 이동하는 3D 웹게임 포트폴리오 시안.">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./online.css">
</head>
<body>
  <canvas id="world" aria-label="서울 출근길 3D 게임"></canvas>
  <div id="shade"></div>
  <header id="topbar"><a class="brand" href="#" id="brand"><span class="brand-icon">↗</span><span>대중교통 출근 게임<small>SEOUL COMMUTE / PLAYABLE PROTOTYPE</small></span></a><div class="top-right"><a href="/credits.html">자산 출처</a><span class="live-dot"></span><span>SEOUL, 08:00</span><button id="settings" class="icon-btn" aria-label="설정">⚙</button></div></header>
  <main id="screen"></main>
  <div id="hud" hidden>
    <div class="health-box"><div><span>COMMUTER ENERGY</span><strong id="hp">100</strong></div><div class="health-track"><i id="hpbar"></i></div><small id="location">공덕동</small></div>
    <div class="clock-box"><small>SEOUL LOCAL TIME</small><strong id="clock">08:00</strong><span>09:00 출근 · 지각 페널티 없음</span></div>
    <div class="timer-box"><small>YOUR COMMUTE</small><strong id="elapsed">00:00.0</strong><button id="pauseButton" aria-label="일시정지">Ⅱ</button></div>
    <div id="next-guide"><span class="guide-symbol">↗</span><div><small>NEXT STEP</small><strong id="guide">스마트폰으로 경로를 확인하세요</strong></div><button id="phoneButton"><kbd>M</kbd> 길찾기</button></div>
    <div id="ride-info" hidden></div>
    <div id="event" hidden></div>
    <div id="interaction" hidden></div>
    <div class="game-footer"><span><kbd>↑↓←→</kbd> 이동 <kbd>Shift</kbd> 달리기 <kbd>E</kbd> 상호작용 <kbd>Space</kbd> 손잡이</span><span id="mode-label"></span></div>
    <div id="damage"></div>
  </div>
  <div id="toast" role="status"></div>
  <div id="dialog" hidden></div>
  <div id="loading"><span class="loading-symbol">↗</span><p>서울의 아침을 준비하는 중<span>BUILDING YOUR MORNING</span></p></div>
  <div id="mobile-controls" hidden><div><button data-key="ArrowUp">↑</button><div><button data-key="ArrowLeft">←</button><button data-key="ArrowDown">↓</button><button data-key="ArrowRight">→</button></div></div><div><button data-key="Shift">달리기</button><button data-action="e">E</button><button data-action="space">잡기</button></div></div>
  <script type="module" src="./game.js"></script>
</body>
</html>
